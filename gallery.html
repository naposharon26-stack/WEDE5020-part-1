<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - Sweet Treats Bakery</title>

    <style>
        /* GLOBAL */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #faf7ff;
            color: #3b2f3f;
        }

        /* HEADER */
        header {
            background: linear-gradient(90deg, #f8c8dc, #e6d0ff);
            text-align: center;
            padding: 25px;
        }

        header h1 {
            margin: 0;
            font-size: 38px;
        }

        header p {
            font-style: italic;
        }

        /* NAV */
        nav {
            background-color: #6d4c7d;
            text-align: center;
            padding: 15px;
        }

        nav a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
            display: inline-block;
        }

        nav a:hover {
            color: #f8c8dc;
        }

        /* TITLE */
        h2 {
            text-align: center;
            margin-top: 25px;
            font-size: 32px;
        }

        /* RESPONSIVE GALLERY GRID */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            padding: 40px;
            max-width: 1100px;
            margin: auto;
        }

        .gallery img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border: 3px solid #e6d0ff;
            transition: 0.3s;
        }

        .gallery img:hover {
            transform: scale(1.05);
            border-color: #f8c8dc;
        }

        /* FOOTER */
        footer {
            color: white;
            margin-top: 30px;
        }

        /* RESPONSIVE DESIGN */
        @media (max-width: 900px) {
            nav a {
                margin: 10px;
                font-size: 14px;
            }
        }

        @media (max-width: 600px) {
            nav a {
                display: block;
                margin: 10px 0;
            }

            .gallery {
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
                padding: 20px;
            }

            header h1 {
                font-size: 28px;
            }
        }
    </style>
</head>
